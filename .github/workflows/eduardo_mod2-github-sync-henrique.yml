name: CI/CD Pipeline - Modulo 2 GitHub Sync (Henrique)

on:
  push:
    branches:
      - 'eduardo'
  pull_request:
    branches:
      - 'eduardo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 1. Linting, 2. Testes e 3. Dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias completas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 1. Linting (Ruff)
        run: ruff check .

      - name: 2. Testes Automaticos (Pytest com Coverage)
        run: coverage run -m pytest
        env:
          CELERY_TASK_ALWAYS_EAGER: "true"
          CREDENTIAL_MASTER_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="

      - name: Relatorio de Cobertura
        run: coverage report

      - name: 3. Verificacao de Vulnerabilidades (Pip-Audit)
        run: pip-audit -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
            !.github/

  deploy:
    name: 4. Publicacao Automatica (Azure)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/eduardo' && github.event_name != 'pull_request'
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ai-platform-github-service-eduardo'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_EDUARDO }}
