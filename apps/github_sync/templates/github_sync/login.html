{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Fluxo</title>
  <link rel="stylesheet" href="{% static 'github_sync/dashboard.css' %}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand"><span class="brand-mark">↗</span> Fluxo <span class="brand-muted">/ Entregas</span></span>
    </header>

    <main class="login">
      <section class="panel">
        <p class="eyebrow">ACESSO</p>
        <h1>Entrar no painel</h1>
        <p class="subtitle">Informe o token de acesso para continuar.</p>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <label>Token de acesso
            <input type="password" name="access_token" autocomplete="current-password" required autofocus>
          </label>
          <button type="submit">Entrar</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
