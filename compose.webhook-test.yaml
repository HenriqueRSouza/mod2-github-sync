services:
  webhook-gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./infra/webhook-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://webhook-gateway:8080
    depends_on:
      - webhook-gateway
    restart: unless-stopped
